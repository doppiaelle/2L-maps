# J1 — a first route, from nothing to a handoff.
#
# The journey the four-tap guarantee is measured against
# (docs/03_USER_JOURNEYS.md, CLAUDE.md §7 rule 1). The tap count is asserted by
# the flow's own shape: every `tapOn` between launch and `Start` is one of them.
#
# It was three until ADR-0018. The app now opens on the map and the route lives
# in a dock section, so opening that section is the first tap — deliberately
# spent, and visible here rather than hidden in a gesture.
appId: com.doppiaelle.twolmaps
---
- launchApp:
    clearState: true

# Tap 1 — open the route section. The map is the opening view.
- assertVisible:
    id: 'plan-screen'
- tapOn:
    id: 'dock-itinerary'
- assertVisible:
    id: 'section-itinerary'

# Tap 2 — add a stop.
- tapOn:
    id: 'plan-add-stop'
- assertVisible:
    id: 'add-stop-input'
- inputText: 'Via Roma'
- assertVisible:
    id: 'add-stop-option'
- tapOn:
    id: 'add-stop-option'

# A second stop, because one stop is not a route.
- tapOn:
    id: 'plan-add-stop'
- inputText: 'Piazza Vecchia'
- tapOn:
    id: 'add-stop-option'

# Tap 2 — optimize. The control says what it will do before it does it.
- assertVisible: 'Optimize'
- tapOn:
    id: 'plan-action'

# Tap 3 — start. The label having changed is the proof the result landed.
- assertVisible: 'Start'
- tapOn:
    id: 'plan-action'
# The boundary. What happens after this is Google Maps, and Maestro cannot see
# inside it — that verification is a human with a phone.
