name: Android Preview

on:
  pull_request:
    paths:
      - 'spike/flutter/**'
      - 'assets/brand/**'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/flutter
    env:
      SDK_URL: ${{ secrets.HERE_SDK_DOWNLOAD_URL }}
      SDK_VERSION: ${{ vars.HERE_SDK_VERSION }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - name: Validate SDK and runtime inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SDK_URL"
          test -n "$SDK_VERSION"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

      - name: Prepare Flutter brand asset
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          logo_src="$GITHUB_WORKSPACE/assets/brand/logo.png"
          logo_dst="$GITHUB_WORKSPACE/spike/flutter/assets/brand/logo.png"
          test -s "$logo_src"
          mkdir -p "$(dirname "$logo_dst")"
          cp "$logo_src" "$logo_dst"
          test -s "$logo_dst"

      - name: Generate HERE SDK plugin from archive
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins /tmp/here-sdk /tmp/here-sdk.zip
          mkdir -p plugins/here_sdk /tmp/here-sdk
          curl -fsSL --retry 3 --retry-all-errors "$SDK_URL" -o /tmp/here-sdk.zip
          if ! unzip -tq /tmp/here-sdk.zip >/dev/null 2>&1; then
            echo "::error::HERE_SDK_DOWNLOAD_URL did not return a valid ZIP archive. Set it to a direct downloadable HERE SDK ZIP URL (not a Drive/GitHub HTML page or landing page)."
            file /tmp/here-sdk.zip || true
            exit 1
          fi
          unzip -q /tmp/here-sdk.zip -d /tmp/here-sdk
          plugin_root="$(find /tmp/here-sdk -maxdepth 6 -type f -name pubspec.yaml -print -quit | xargs -r dirname)"
          test -n "$plugin_root"
          cp -R "$plugin_root"/. plugins/here_sdk/
          test -f plugins/here_sdk/pubspec.yaml

      - name: Configure Android SDK levels and package
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          logo_src="$GITHUB_WORKSPACE/assets/brand/logo.png"
          test -s "$logo_src"
          mkdir -p spike/flutter/android/app/src/main/res/drawable
          cp "$logo_src" spike/flutter/android/app/src/main/res/drawable/twolmaps_logo.png
          test -s spike/flutter/android/app/src/main/res/drawable/twolmaps_logo.png
          test -f spike/flutter/android/android/app/build.gradle || true
          if test -f spike/flutter/android/app/build.gradle; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.doppiaelle.twolmaps"/' spike/flutter/android/app/build.gradle
            sed -i 's/namespace "[^"]*"/namespace "com.doppiaelle.twolmaps"/' spike/flutter/android/app/build.gradle || true
          fi
          if test -f spike/flutter/android/app/src/main/AndroidManifest.xml; then
            sed -i 's/android:label="[^"]*"/android:label="2L Maps"/' spike/flutter/android/app/src/main/AndroidManifest.xml || true
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test
        run: flutter test

      - name: flutter build apk
        run: |
          flutter build apk --debug             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"             --dart-define=HERE_SDK_VERSION="$SDK_VERSION"
