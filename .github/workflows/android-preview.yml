name: android-preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spike/flutter/**'
      - '.github/workflows/android-preview.yml'

jobs:
  build-android-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike/flutter
    env:
      SDK_URL: ${{ secrets.HERE_SDK_DOWNLOAD_URL }}
      SDK_VERSION: ${{ vars.HERE_SDK_VERSION || vars.HERE_SDK_SDK_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Validate SDK inputs
        run: |
          set -euo pipefail
          test -n "$SDK_URL" || { echo "Missing HERE SDK download URL secret (HERE_SDK_DOWNLOAD_URL)"; exit 1; }
          test -n "$SDK_VERSION" || { echo "Missing HERE SDK version repository variable (HERE_SDK_VERSION)"; exit 1; }
      - name: Prepare HERE SDK plugin
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf /tmp/here-sdk spike/flutter/plugins
          mkdir -p /tmp/here-sdk spike/flutter/plugins
          python3 -m pip install --disable-pip-version-check --quiet "gdown==5.2.0"
          gdown --fuzzy "$SDK_URL" -O /tmp/here-sdk/here.zip
          test "$(head -c 2 /tmp/here-sdk/here.zip)" = "PK"
          unzip -q /tmp/here-sdk/here.zip -d /tmp/here-sdk/unpacked
          tarball="$(find /tmp/here-sdk/unpacked -type f -name '*.tar.gz' | head -n 1)"
          test -n "$tarball"
          tar -xzf "$tarball" -C spike/flutter/plugins
          extracted="$(find spike/flutter/plugins -maxdepth 3 -type f -name pubspec.yaml -print -quit)"
          test -n "$extracted"
          plugin_dir="$(dirname "$extracted")"
          if [ "$plugin_dir" != "spike/flutter/plugins/here_sdk" ]; then
            rm -rf spike/flutter/plugins/here_sdk
            mkdir -p spike/flutter/plugins/here_sdk
            find "$plugin_dir" -mindepth 1 -maxdepth 1 -exec mv {} spike/flutter/plugins/here_sdk/ \;
            rmdir "$plugin_dir" 2>/dev/null || true
          fi
      - name: Generate Android project
        run: flutter create --platforms=android --org com.doppiaelle --project-name twolmaps .
      - name: Configure Android SDK levels and package
        run: |
          set -euo pipefail
          git show HEAD:spike/flutter/lib/main.dart > lib/main.dart
          sed -i 's/^name: .*/name: twol_maps_spike/' pubspec.yaml
          sed -i 's/package:twolmaps/package:twol_maps_spike/g' test/*.dart
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
          sed -i 's/namespace = "doppiaelle.twolmaps"/namespace = "com.doppiaelle.twolmaps"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "doppiaelle.twolmaps"/applicationId = "com.doppiaelle.twolmaps"/' android/app/build.gradle.kts
          grep -q '^name: twol_maps_spike
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'minSdk = 24' android/app/build.gradle.kts
          grep -R "com.doppiaelle.twolmaps" android
      - name: Dependencies and tests
        run: |
          flutter pub get
          flutter test
      - name: Build installable APK without provider secrets
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Verify provider REST keys are absent
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          ! unzip -p "$apk" classes.dex | strings | grep -Eqi 'ORS_API_KEY|HERE_API_KEY|api\.heigit\.org|router\.hereapi\.com'
      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: twolmaps-android-preview
          path: spike/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 pubspec.yaml
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'minSdk = 24' android/app/build.gradle.kts
          grep -R "com.doppiaelle.twolmaps" android
      - name: Dependencies and tests
        run: |
          flutter pub get
          flutter test
      - name: Build installable APK without provider secrets
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Verify provider REST keys are absent
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          ! unzip -p "$apk" classes.dex | strings | grep -Eqi 'ORS_API_KEY|HERE_API_KEY|api\.heigit\.org|router\.hereapi\.com'
      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: twolmaps-android-preview
          path: spike/flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
