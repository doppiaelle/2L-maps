name: android-preview

# Builds the Android development build — the artifact that is installed once on a
# physical phone, after which every change arrives over the local network by QR
# code with no rebuild (ADR-0014).
#
# Linux runners only, so minutes bill at 1× rather than the 10× macOS rate. This
# is why the whole approach costs nothing.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: development build (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gradle needs a JDK; the runner image already carries the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      # The Maps key is restricted by package name AND the SHA-1 of the signing
      # certificate. CI signs with its own keystore, so that keystore's SHA-1 must
      # be registered against the key or the map renders grey with no error —
      # tiles simply never load (docs/25_DEPLOYMENT.md).
      #
      # Absent secrets are not a failure: the build still produces an installable
      # app, it just cannot show a map or reach the backend. That is a useful
      # artifact while the accounts do not exist yet.
      - name: Generate native project
        env:
          EXPO_PUBLIC_MAPS_API_KEY_ANDROID: ${{ secrets.MAPS_API_KEY_ANDROID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Unset is a supported state: the map falls back to Google's default
          # style rather than rendering blank (risk C15). The build does not fail
          # without them, and the difference is visible rather than reported.
          EXPO_PUBLIC_MAP_ID_LIGHT: ${{ secrets.MAP_ID_LIGHT }}
          EXPO_PUBLIC_MAP_ID_DARK: ${{ secrets.MAP_ID_DARK }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restore the signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/ci.keystore
          echo "keystore restored"

      # `assembleDebug` rather than release: a development build is meant to load
      # JavaScript from the dev server, which a release build will not do.
      - name: Build
        working-directory: android
        env:
          EXPO_PUBLIC_MAPS_API_KEY_ANDROID: ${{ secrets.MAPS_API_KEY_ANDROID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Unset is a supported state: the map falls back to Google's default
          # style rather than rendering blank (risk C15). The build does not fail
          # without them, and the difference is visible rather than reported.
          EXPO_PUBLIC_MAP_ID_LIGHT: ${{ secrets.MAP_ID_LIGHT }}
          EXPO_PUBLIC_MAP_ID_DARK: ${{ secrets.MAP_ID_DARK }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Report the signing SHA-1
        working-directory: android
        continue-on-error: true
        run: |
          echo "Register this SHA-1 against the Google Maps Android key,"
          echo "or the map will render grey with no error message:"
          ./gradlew signingReport --no-daemon | grep -A1 'SHA1' | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: 2l-maps-development-build
          path: android/app/build/outputs/apk/debug/*.apk
          # Long enough to reinstall after a phone reset without rebuilding.
          retention-days: 30
          if-no-files-found: error
