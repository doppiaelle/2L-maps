name: verify

# Runs on every push and pull request (docs/25_DEPLOYMENT.md §CI).
# Builds are deliberately not triggered here: macOS runners bill minutes at 10×,
# so the free allowance is roughly 200 effective macOS minutes a month
# (docs/31_COST_MODEL.md). This workflow is Linux-only and therefore cheap.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Test
        run: npm test -- --ci

  prebuild:
    name: native config resolves (risk C6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Risk C6 is a config plugin breaking `expo prebuild`, which dependency
      # resolution cannot see: the peer range was satisfied when it last fired.
      # Android prebuild is pure Node, so this gate runs without a Mac and
      # catches an incompatible Expo SDK / react-native-maps pair at the commit
      # that introduces it rather than several waves later (ADR-0005).
      - name: Prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assert the Maps key is wired from app.config.ts
        env:
          EXPO_PUBLIC_MAPS_API_KEY_ANDROID: AIza-CI-PLACEHOLDER
        run: |
          npx expo prebuild --platform android --no-install --clean
          grep -q 'com.google.android.geo.API_KEY' android/app/src/main/AndroidManifest.xml

  bundle:
    name: the JavaScript bundles (risk C6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # **Typecheck and tests do not bundle.** Jest transforms only the files a
      # test imports; Metro walks every module in the dependency graph and runs
      # the codegen Babel plugin over React Native's own source. A Babel preset
      # pinned to the wrong Expo SDK is invisible to everything above and fatal
      # here — and it used to be discovered fifteen minutes into a Gradle build,
      # because the release build is the first thing that bundles.
      #
      # About a minute, on a Linux runner, on every push.
      #
      # The probe values are what make this more than a syntax check.
      # `EXPO_PUBLIC_*` variables are not read at runtime — there is no
      # environment on a phone — they are substituted into the bundle by Babel,
      # and only where it can see the name: `process.env.FOO`. Read through a
      # variable instead and the substitution silently does not happen, the
      # build succeeds, and the app installs reporting itself unconfigured while
      # the secrets sit correctly in CI.
      #
      # So the bundle is searched for the values that went in. Nothing else in
      # the pipeline can tell the difference.
      - name: Export the Android bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-probe-url.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-probe-anon-key
        run: npx expo export --platform android --output-dir /tmp/expo-export

      - name: Assert the configuration reached the bundle
        run: |
          for probe in ci-probe-url ci-probe-anon-key; do
            if ! grep -rqF "$probe" /tmp/expo-export/_expo/static/js/android/; then
              echo "::error::\"$probe\" is missing from the bundle."
              echo "An EXPO_PUBLIC_ variable is being read in a way Babel cannot"
              echo "substitute. It must be a static member expression —"
              echo "process.env.EXPO_PUBLIC_NAME — never env[name] or a spread of"
              echo "process.env. See readSupabaseConfig in lib/supabase/client.ts."
              exit 1
            fi
          done
          echo "Both probe values are present: EXPO_PUBLIC_ substitution is working."
