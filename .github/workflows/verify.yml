name: verify

# Runs on every push and pull request (docs/25_DEPLOYMENT.md §CI).
# Builds are deliberately not triggered here: macOS runners bill minutes at 10×,
# so the free allowance is roughly 200 effective macOS minutes a month
# (docs/31_COST_MODEL.md). This workflow is Linux-only and therefore cheap.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Test
        run: npm test -- --ci

  prebuild:
    name: native config resolves (risk C6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Risk C6 is a config plugin breaking `expo prebuild`, which dependency
      # resolution cannot see: the peer range was satisfied when it last fired.
      # Android prebuild is pure Node, so this gate runs without a Mac and
      # catches an incompatible Expo SDK / react-native-maps pair at the commit
      # that introduces it rather than several waves later (ADR-0005).
      - name: Prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assert the Maps key is wired from app.config.ts
        env:
          EXPO_PUBLIC_MAPS_API_KEY_ANDROID: AIza-CI-PLACEHOLDER
        run: |
          npx expo prebuild --platform android --no-install --clean
          grep -q 'com.google.android.geo.API_KEY' android/app/src/main/AndroidManifest.xml

  functions:
    name: the Edge Functions resolve under Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # **The Edge Functions run on a runtime nothing else in this pipeline
      # uses.** `tsconfig.json` excludes `supabase/functions/*/index.ts` because
      # they reference Deno globals, and the Jest suites reach `_shared/*`
      # through Node's resolver, which infers extensions Deno does not. So the
      # backend was checked twice by resolvers looser than the one that runs it,
      # and its first deploy failed on 82 relative imports missing `.ts` — every
      # one of them in a file the suite had already passed.
      #
      # Graph resolution, not `deno check`, because **that is what deploying
      # does**: `supabase functions deploy` bundles, it does not type-check, and
      # `failed to create the graph` is the exact error that came back. A
      # type-check here would additionally judge the `npm:` packages' own types
      # — real errors that production never evaluates — and a gate that goes red
      # for something that cannot break is a gate people learn to override.
      #
      # `supabase/test/module-graph.test.ts` asserts the same property offline
      # in milliseconds, under Deno's rules rather than Node's. This is the
      # version that uses Deno itself, including the `npm:` specifiers in the
      # import map, which no offline check can confirm are downloadable.
      - name: Build the module graph for every entry point
        run: |
          # `deno info` exits 0 even when a module is missing: it records the
          # failure *inside* the graph and reports success at the shell. The
          # first version of this job trusted the exit code and was therefore
          # green by construction — it took a canary to notice, which is the
          # whole argument for keeping one.
          graph_errors() {
            local out
            if ! out=$(deno info --json --config supabase/functions/deno.json "$1" 2>&1); then
              printf '%s\n' "$out"
              return
            fi
            printf '%s' "$out" | jq -r '.. | objects | select(has("error")) | .error'
          }

          # Prove the check fails before trusting that it passes. If Deno ever
          # renames the field this reads, the canary goes silent and the job
          # fails saying so — rather than passing over an unresolvable graph,
          # which is the direction that costs a deploy.
          printf "import './nothing-here.ts';\n" > /tmp/canary.ts
          canary=$(graph_errors /tmp/canary.ts)
          if [ -z "$canary" ]; then
            echo "::error::An import of a file that does not exist was reported clean."
            echo "This job cannot see a broken graph, so it would pass whatever"
            echo "state supabase/functions is in. Fix the detection, not this line."
            exit 1
          fi
          echo "Canary rejected as expected — the check can see a broken graph."

          checked=0
          broken=0
          for entry in supabase/functions/*/index.ts; do
            errors=$(graph_errors "$entry")
            if [ -n "$errors" ]; then
              echo "::error file=$entry::$errors"
              broken=1
            else
              echo "▸ $entry"
            fi
            checked=$((checked + 1))
          done

          # A glob that matches nothing runs the loop zero times and reports
          # success — the same vacuous pass in a different costume.
          if [ "$checked" -eq 0 ]; then
            echo "::error::No entry points matched supabase/functions/*/index.ts."
            exit 1
          fi
          [ "$broken" -eq 0 ] || exit 1
          echo "$checked entry points resolve."

  bundle:
    name: the JavaScript bundles (risk C6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # **Typecheck and tests do not bundle.** Jest transforms only the files a
      # test imports; Metro walks every module in the dependency graph and runs
      # the codegen Babel plugin over React Native's own source. A Babel preset
      # pinned to the wrong Expo SDK is invisible to everything above and fatal
      # here — and it used to be discovered fifteen minutes into a Gradle build,
      # because the release build is the first thing that bundles.
      #
      # About a minute, on a Linux runner, on every push.
      #
      # The probe values are what make this more than a syntax check.
      # `EXPO_PUBLIC_*` variables are not read at runtime — there is no
      # environment on a phone — they are substituted into the bundle by Babel,
      # and only where it can see the name: `process.env.FOO`. Read through a
      # variable instead and the substitution silently does not happen, the
      # build succeeds, and the app installs reporting itself unconfigured while
      # the secrets sit correctly in CI.
      #
      # So the bundle is searched for the values that went in. Nothing else in
      # the pipeline can tell the difference.
      - name: Export the Android bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci-probe-url.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-probe-anon-key
        run: npx expo export --platform android --output-dir /tmp/expo-export

      - name: Assert the configuration reached the bundle
        run: |
          for probe in ci-probe-url ci-probe-anon-key; do
            if ! grep -rqF "$probe" /tmp/expo-export/_expo/static/js/android/; then
              echo "::error::\"$probe\" is missing from the bundle."
              echo "An EXPO_PUBLIC_ variable is being read in a way Babel cannot"
              echo "substitute. It must be a static member expression —"
              echo "process.env.EXPO_PUBLIC_NAME — never env[name] or a spread of"
              echo "process.env. See readSupabaseConfig in lib/supabase/client.ts."
              exit 1
            fi
          done
          echo "Both probe values are present: EXPO_PUBLIC_ substitution is working."
