name: flutter-app-foundation

on:
  pull_request:
    paths:
      - "spike/flutter/**"
      - ".github/workflows/flutter-spike.yml"
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build the iOS simulator target on macOS
        required: true
        type: boolean
        default: false

concurrency:
  group: flutter-app-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter app Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Verify required inputs
        env:
          SDK_ID: ${{ secrets.HERE_SDK_ACCESS_KEY_ID }}
          SDK_SECRET: ${{ secrets.HERE_SDK_ACCESS_KEY_SECRET }}
          SDK_URL: ${{ secrets.HERE_SDK_DOWNLOAD_URL }}
        run: |
          set -euo pipefail
          test -n "$SDK_ID"
          test -n "$SDK_SECRET"
          test -n "$SDK_URL"

      - name: Prepare HERE SDK
        working-directory: spike/flutter
        env:
          SDK_URL: ${{ secrets.HERE_SDK_DOWNLOAD_URL }}
          SDK_SHA256: ${{ vars.HERE_SDK_SHA256 }}
          SDK_VERSION: ${{ vars.HERE_SDK_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/here-sdk plugins
          python3 -m pip install --disable-pip-version-check --quiet "gdown==5.2.0"
          gdown --fuzzy "$SDK_URL" -O /tmp/here-sdk/here.zip
          test "$(head -c 2 /tmp/here-sdk/here.zip)" = "PK"
          test -n "$SDK_VERSION"
          unzip -q /tmp/here-sdk/here.zip -d /tmp/here-sdk/unpacked
          sha256sum /tmp/here-sdk/here.zip | tee /tmp/here-sdk/sha256.txt
          actual="$(cut -d' ' -f1 /tmp/here-sdk/sha256.txt)"
          if [ -n "${SDK_SHA256:-}" ] && [ "$actual" != "$SDK_SHA256" ]; then
            echo "::error::HERE SDK checksum mismatch"
            exit 1
          fi
          echo "HERE SDK archive SHA-256: $actual" >> "$GITHUB_STEP_SUMMARY"
          tarball="$(find /tmp/here-sdk/unpacked -type f -name '*.tar.gz' | head -n 1)"
          test -n "$tarball"
          tar -xzf "$tarball" -C plugins
          extracted="$(find plugins -maxdepth 2 -type f -name pubspec.yaml -print -quit)"
          test -n "$extracted"
          plugin_dir="$(dirname "$extracted")"
          if [ "$plugin_dir" = "plugins" ]; then
            mkdir -p plugins/here_sdk
            find plugins -mindepth 1 -maxdepth 1 ! -name here_sdk -exec mv {} plugins/here_sdk/ \;
          elif [ "$plugin_dir" != "plugins/here_sdk" ]; then
            rm -rf plugins/here_sdk
            mv "$plugin_dir" plugins/here_sdk
          fi

      - name: Generate Flutter platform projects
        working-directory: spike/flutter
        run: |
          flutter create --platforms=android --org com.doppiaelle --project-name twolmaps .
          sed -i '/<manifest /a\\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"com.doppiaelle.twolmaps"' android/app/build.gradle.kts
          rm -f test/widget_test.dart

      - name: Configure Android SDK levels
        working-directory: spike/flutter
        run: |
          set -euo pipefail
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'minSdk = 24' android/app/build.gradle.kts
          grep -q 'targetSdk = 36' android/app/build.gradle.kts

      - name: Dependencies and tests
        working-directory: spike/flutter
        run: |
          flutter pub get
          flutter test

      - name: Build Android
        working-directory: spike/flutter
        env:
          SDK_ID: ${{ secrets.HERE_SDK_ACCESS_KEY_ID }}
          SDK_SECRET: ${{ secrets.HERE_SDK_ACCESS_KEY_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          flutter build apk --debug             --dart-define=HERE_ACCESS_KEY_ID="$SDK_ID"             --dart-define=HERE_ACCESS_KEY_SECRET="$SDK_SECRET"             --dart-define=SUPABASE_URL="$SUPABASE_URL"             --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify provider keys never enter the mobile build
        working-directory: spike/flutter
        run: |
          set -euo pipefail
          ! grep -R -n "String.fromEnvironment(\x27ORS_API_KEY\x27)" lib
          ! grep -R -n "String.fromEnvironment(\x27HERE_REST_API_KEY\x27)" lib

  ios:
    name: Flutter app iOS build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Prepare and build
        working-directory: spike/flutter
        env:
          SDK_URL: ${{ secrets.HERE_SDK_DOWNLOAD_URL }}
          SDK_ID: ${{ secrets.HERE_SDK_ACCESS_KEY_ID }}
          SDK_SECRET: ${{ secrets.HERE_SDK_ACCESS_KEY_SECRET }}
          SDK_VERSION: ${{ vars.HERE_SDK_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/here-sdk plugins
          test -n "$SDK_VERSION"
          python3 -m pip install --disable-pip-version-check --quiet "gdown==5.2.0"
          gdown --fuzzy "$SDK_URL" -O /tmp/here-sdk/here.zip
          test "$(head -c 2 /tmp/here-sdk/here.zip)" = "PK"
          unzip -q /tmp/here-sdk/here.zip -d /tmp/here-sdk/unpacked
          tarball="$(find /tmp/here-sdk/unpacked -type f -name '*.tar.gz' | head -n 1)"
          test -n "$tarball"
          tar -xzf "$tarball" -C plugins
          extracted="$(find plugins -maxdepth 2 -type f -name pubspec.yaml -print -quit)"
          test -n "$extracted"
          plugin_dir="$(dirname "$extracted")"
          if [ "$plugin_dir" = "plugins" ]; then
            mkdir -p plugins/here_sdk
            find plugins -mindepth 1 -maxdepth 1 ! -name here_sdk -exec mv {} plugins/here_sdk/ \;
          elif [ "$plugin_dir" != "plugins/here_sdk" ]; then
            rm -rf plugins/here_sdk
            mv "$plugin_dir" plugins/here_sdk
          fi
          flutter create --platforms=ios --org com.doppiaelle --project-name twolmaps .
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string '2L Maps usa la posizione per guidarti lungo l’itinerario.'" ios/Runner/Info.plist
          grep -q 'NSLocationWhenInUseUsageDescription' ios/Runner/Info.plist
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.doppiaelle.twolmaps;' ios/Runner.xcodeproj/project.pbxproj
          rm -f test/widget_test.dart
          flutter pub get
          flutter build ios --simulator --no-codesign             --dart-define=HERE_ACCESS_KEY_ID="$SDK_ID"             --dart-define=HERE_ACCESS_KEY_SECRET="$SDK_SECRET"
