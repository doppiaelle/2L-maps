name: deploy-functions

# Deploys the Edge Functions.
#
# **This workflow did not exist**, and nothing else deployed them. The
# migrations created every table and the app was built with the right project
# URL, so sign-in worked and the map drew — and then every single call to
# `/functions/v1/...` answered 404. Address search returned nothing, the parser
# did nothing, and Optimize would have failed the same way, all silently,
# because a 404 from a URL that is supposed to exist is indistinguishable from
# an empty answer at the point where a user is looking.
#
# **It used to be manual only, and that made the client and the server drift.**
# The reasoning was that a deploy replaces code which spends money on Google's
# APIs, so a human should press it. What actually happened is that `android-preview`
# ships a new app on every push to `main` while the functions waited for
# somebody to remember — so a change to both halves of a contract went out as
# half a change. Optimization was fixed on both sides and stayed broken, because
# only the client half was running (ADR-0024).
#
# Now it deploys automatically when `supabase/functions/**` changes on `main`,
# which is the same trigger the app already has and for the same reason: the two
# halves have to move together or they are not one system.
#
# `workflow_dispatch` stays, for a redeploy after a secret changes — a secret is
# not a file in this repository, so nothing here can notice it.
#
# **The credentials live on a GitHub Environment, not on the repository**, which
# is what made the first automatic run fail: a push has no `inputs.environment`
# to read, the job defaulted to `production`, and `production` does not hold
# them. `supabase link --project-ref ""` is what that looks like from the log,
# which is a cryptic way of saying "a secret is missing" — hence the check
# before it now.
#
# Set the `DEPLOY_ENVIRONMENT` repository variable to override the default
# without editing this file.

on:
  push:
    branches: [main]
    paths:
      # Migrations are deliberately absent: a schema change is not reversible by
      # pushing again, and `migrate` stays a decision somebody makes.
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Which project to deploy to
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-functions-${{ inputs.environment || vars.DEPLOY_ENVIRONMENT || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy Edge Functions
    runs-on: ubuntu-latest
    # A push has no input to read. `staging` is the environment the manual runs
    # have actually been using — the one that holds the secrets — and the
    # repository variable is the way to change that without editing this file.
    environment: ${{ inputs.environment || vars.DEPLOY_ENVIRONMENT || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      # Pinned for the reason `migrate` is: a CLI that changes its own flags
      # overnight breaks the workflow on the day it is needed, and did.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # **Before anything is attempted.** Without this the CLI is handed an empty
      # `--project-ref` and answers "Access token not provided", which sends the
      # reader looking for a login problem rather than a missing secret. The
      # values are never printed — only whether they are there.
      - name: Check the credentials are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing"
            echo "::error::This job read them from the GitHub Environment '${{ inputs.environment || vars.DEPLOY_ENVIRONMENT || 'staging' }}'."
            echo "::error::Add them there, or set the DEPLOY_ENVIRONMENT repository variable to the environment that has them."
            exit 1
          fi

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Declared with `env(...)` in config.toml and configured in the
          # dashboard instead; empty is correct and is not the same as unset to
          # a config parser.
          SUPABASE_AUTH_APPLE_CLIENT_ID: ''
          SUPABASE_AUTH_APPLE_SECRET: ''
          SUPABASE_AUTH_GOOGLE_CLIENT_ID: ''
          SUPABASE_AUTH_GOOGLE_SECRET: ''
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --yes

      # No function name deploys all of them. Naming them here would be a list
      # to keep in step with `supabase/functions/`, and the one that fell out of
      # step would be the one nobody noticed was missing.
      #
      # `verify_jwt` is per function in `config.toml` — true everywhere except
      # the RevenueCat webhook, which has no Supabase JWT and is gated by a
      # signature check instead (docs/19_SECURITY.md §6).
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: What was deployed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
        run: supabase functions list --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
